
name: Build IRON AND ASH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create project configuration
        run: |
          echo '{"name":"iron-ash","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.ironash.game","appName":"IRON AND ASH","webDir":".","plugins":{}}' > capacitor.config.json

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project
        run: npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-ash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
